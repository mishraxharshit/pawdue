# Calls the reminder endpoint once an hour.
#
# Why this exists: Vercel's free (Hobby) plan only allows a cron job once
# per DAY, but sending each groomer's reminders at a sensible LOCAL hour
# (see REMINDER_SEND_HOUR in .env.example) needs an hourly trigger.
# GitHub Actions can do that for free.
#
# Needs two repository secrets (GitHub repo > Settings > Secrets and
# variables > Actions > New repository secret):
#   APP_URL      your live site, no trailing slash, e.g. https://pawdue.pet
#                (use the exact address your site opens on: a redirect from
#                pawdue.pet to www.pawdue.pet drops the secret and fails)
#   CRON_SECRET  the same value as CRON_SECRET in Vercel
#
# This job now FAILS (red X in the Actions tab) when the endpoint does not
# answer 200, so a broken setup can no longer look like a green success.
name: Hourly reminder check

on:
  schedule:
    - cron: "5 * * * *"   # minute 5 of every hour (UTC)
  workflow_dispatch: {}    # also lets you run it by hand from the Actions tab

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/send-reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing APP_URL or CRON_SECRET repository secret."; exit 1
          fi
          # Drop any trailing slash: "https://site/" + "/api/..." becomes "//api/..." and gets redirected.
          APP_URL="${APP_URL%/}"
          code=$(curl -sS -o response.json -w "%{http_code} %{redirect_url}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/send-reminders")
          redirect="${code#* }"
          code="${code%% *}"
          echo "HTTP $code"
          cat response.json; echo
          if [ -n "$redirect" ]; then
            echo "The address redirects to: $redirect"
            echo "Set the APP_URL secret to exactly that address (origin only, no path, no trailing slash)."
          fi
          if [ "$code" != "200" ]; then
            echo "Reminder endpoint did not return 200. Check APP_URL (exact address, no redirect) and CRON_SECRET."
            exit 1
          fi